# One website. Listens on port 80 inside the container.
server {
    listen 80;
    charset utf-8;                       # tell browsers every text file is UTF-8

    # Files are served from this folder; compose mounts data/ here read-only.
    root /usr/share/nginx/html;

    # Compress text on the way out. The daily exports shrink about 10x.
    gzip on;
    gzip_types application/json text/html text/css text/plain;
    gzip_min_length 1024;

    # "/" shows the ledger page.
    location = / {
        try_files /binder_ledger.html =404;
    }

    # Internal files: rollback copies and the private card list are not for visitors.
    location ~ (\.last_good\.|^/cards\.csv$|^/cm_match\.json$) {
        return 404;
    }

    # Any other path is a plain file from data/ (binder.json, history/...).
    # autoindex on = show a file listing for folders. no-store = never cache,
    # so a refresh is visible immediately.
    # the movers post is Markdown; serve it as text so the browser shows it instead of downloading
    location = /movers.md { default_type text/plain; charset utf-8; }

    location / {
        autoindex on;
        add_header Cache-Control "no-store";
    }
}
